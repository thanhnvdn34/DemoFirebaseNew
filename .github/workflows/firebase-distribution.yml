name: Build Debug & Distribute to Firebase

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        type: string
      tester_group:
        description: 'Firebase tester group aliases, separated by commas'
        required: false
        default: 'Group1,Group2,Group-3'
        type: string

permissions:
  contents: read

jobs:
  build-and-distribute:
    name: Build Debug APK & Upload to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Verify signing keystore
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/cer/certificate.jks
        run: |
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Compute unique build tag from timestamp
        run: |
          BUILD_TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        working-directory: app
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ github.workspace }}/cer/certificate.jks
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.KEY_PASSWORD }}
        working-directory: app
        run: |
          ./gradlew assembleDebug
          APK_PATH="$GITHUB_WORKSPACE/app/app/build/outputs/apk/debug/app-debug.apk"
          DISTRIBUTION_APK_PATH="$GITHUB_WORKSPACE/app/app/build/outputs/apk/debug/app-debug-${BUILD_TAG}.apk"
          test -s "$APK_PATH"
          mv "$APK_PATH" "$DISTRIBUTION_APK_PATH"
          test -s "$DISTRIBUTION_APK_PATH"
          echo "APK_PATH=$DISTRIBUTION_APK_PATH" >> "$GITHUB_ENV"

      - name: Prepare Firebase release notes
        env:
          RELEASE_NOTE_INPUT: ${{ inputs.release_notes }}
          TRIGGER_USER: ${{ github.actor }}
        run: |
          export TZ=Asia/Ho_Chi_Minh
          VERSION_NAME=$(grep -m 1 'versionName' app/app/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m 1 'versionCode' app/app/build.gradle.kts | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          NOW=$(date '+%Y-%m-%d %H:%M')
          {
            echo "${VERSION_NAME}(${VERSION_CODE})"
            echo "${RELEASE_NOTE_INPUT}"
            echo "Distributed by ${TRIGGER_USER}"
            echo "At ${NOW}"
            } > release-notes.txt
          echo "RELEASE_NOTES_FILE=$GITHUB_WORKSPACE/release-notes.txt" >> "$GITHUB_ENV"

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TESTER_GROUP: ${{ inputs.tester_group }}
        run: |
          SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_PATH"
          chmod 600 "$SERVICE_ACCOUNT_PATH"
          trap 'rm -f "$SERVICE_ACCOUNT_PATH"' EXIT
          test -s "$SERVICE_ACCOUNT_PATH"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$SERVICE_ACCOUNT_PATH"
          export GOOGLE_APPLICATION_CREDENTIALS="$SERVICE_ACCOUNT_PATH"
          npx --yes firebase-tools@15.22.3 appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUP" \
            --release-notes-file "$RELEASE_NOTES_FILE"