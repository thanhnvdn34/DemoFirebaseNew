name: Build Debug & Distribute to Firebase

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes'
        required: false
        default: 'New debug build'
        type: string
      tester_group:
        description: 'Firebase tester group'
        required: false
        default: 'Group1'
        type: string

jobs:
  build-and-distribute:
    name: Build Debug APK & Upload to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compute unique build tag from release notes
        run: |
          RAW_RELEASE_NOTE="${{ inputs.release_notes }}"
          RELEASE_NOTE_TAG=$(echo "$RAW_RELEASE_NOTE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/-\+/-/g; s/^-\|-$//g; s/^-//; s/-$//' | cut -c1-30)
          if [ -z "$RELEASE_NOTE_TAG" ]; then
            RELEASE_NOTE_TAG="release"
          fi
          RELEASE_NOTE_TAG="${RELEASE_NOTE_TAG}-${{ github.run_number }}"
          echo "RELEASE_NOTE_TAG=$RELEASE_NOTE_TAG" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        working-directory: app
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          RELEASE_NOTE_TAG: ${{ env.RELEASE_NOTE_TAG }}
        working-directory: app
        run: |
          ./gradlew assembleDebug -PbuildSha=${RELEASE_NOTE_TAG} \
            -Pandroid.injected.signing.store.file=$(pwd)/../cer/certificate.jks \
            -Pandroid.injected.signing.store.password=$KS_PASS \
            -Pandroid.injected.signing.key.alias=$KS_ALIAS \
            -Pandroid.injected.signing.key.password=$KS_KEY_PASS
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug-${RELEASE_NOTE_TAG}.apk
          echo "APK_PATH=app/app/build/outputs/apk/debug/app-debug-${RELEASE_NOTE_TAG}.apk" >> $GITHUB_ENV

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ inputs.tester_group }}
          file: ${{ env.APK_PATH }}
          releaseNotes: "${{ inputs.release_notes }}"